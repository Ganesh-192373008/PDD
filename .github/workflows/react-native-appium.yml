name: Mobile Appium E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appium-mobile-test:
    runs-on: macos-latest # macOS supports hardware acceleration for Android Emulators

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: testing/appium-e2e/package.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Appium & UiAutomator2 Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Install Local Dependencies
      run: |
        cd testing/appium-e2e
        npm install

    - name: Run E2E Tests on Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        profile: pixel
        script: |
          # Launch appium server in background
          appium --log reports/appium_server.log &
          sleep 10
          # Run tests
          cd testing/appium-e2e
          npm test

    - name: Upload Test Reports & Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: appium-test-reports
        path: |
          testing/appium-e2e/reports/
          testing/appium-e2e/reports/failures/
