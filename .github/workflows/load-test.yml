name: API k6 Load Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  k6-load-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Create Reports Directory
      run: mkdir -p reports

    - name: Install Backend Dependencies & Seed Database
      run: |
        cd backend
        npm install
        node seed.js
      env:
        MONGO_URI: mongodb://localhost:27017/agroassist
        JWT_SECRET: supersecret

    - name: Setup k6
      uses: grafana/setup-k6-action@v1

    - name: Start Backend Server and Run k6 Load Test (Login Endpoint)
      run: |
        # Start backend API server in the background
        cd backend
        node server.js &
        sleep 8 # wait for backend server to spin up
        
        # Run k6 load tests
        cd ..
        k6 run testing/load-tests/login.js --out json=reports/k6_result.json
      env:
        PORT: 5000
        MONGO_URI: mongodb://localhost:27017/agroassist
        JWT_SECRET: supersecret

    - name: Upload Performance Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-performance-report
        path: |
          reports/
          summary.html
